name: Route integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@10.9.8
      - name: Install the locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile reproducibility
        run: npm run verify:lockfile
      - name: Run adversarial route tests
        run: npm run test:route-integrity
      - name: Run blog cannibalization redirect tests
        run: node --experimental-strip-types --test tests/blog-canibalizacion-redirects.test.mjs
      - name: Run closed SEO service 301 and href tests
        run: node --experimental-strip-types --test tests/seo-service-redirects.test.mjs tests/unpublished-landing-redirects.test.mjs tests/seo-closed-hrefs.test.mjs tests/seo-cruce-2810-freeze.test.mjs tests/seo-cruce-2810-no-import.test.mjs
      - name: Run blog related-posts tests
        run: node --experimental-strip-types --test tests/blog-related-posts.test.mjs
      - name: Run blog article quote styles tests
        run: node --experimental-strip-types --test tests/blog-article-quotes.test.mjs
      - name: Run blog excerpt and byline tests
        run: node --experimental-strip-types --test tests/blog-editorial-meta.test.mjs tests/blog-article-author-dates.test.mjs
      - name: Unit-test CTA click classification
        run: npm run test:cta-click
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build and verify a fresh route artifact
        run: npm run verify:routes:build
      - name: WordPress live endpoint guard
        run: node --experimental-strip-types --test tests/wp-live-endpoint-guard.test.mjs
      - name: Servicios seed reads snapshot (no live WP)
        run: node --import tsx --test tests/servicios-wp-for-seed.test.mjs
      - name: Endpoint runtime rewrite (sin CMS_BLOB_IMAGES)
        run: node --experimental-strip-types --test tests/wp-endpoint-runtime.test.mjs
      - name: Podcast document titles (sin cortes ¿ ¡)
        run: npx tsx --test tests/podcast-title-format.test.mjs
      - name: WP served static/runtime guard (HTML + CSS/JS servidos)
        run: node --experimental-strip-types --test tests/wp-served-static-assets-guard.test.mjs

  sin-wp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@10.9.8
      - name: Install the locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production build for smoke
        run: npm run build
      - name: Sin-WP smoke A/B/C
        run: |
          PORT=3456 HOSTNAME=127.0.0.1 npm run start &
          srv_pid=$!
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null -H 'user-agent: PlayfulQa/1.0' "http://127.0.0.1:3456/blog"; then
              break
            fi
            if ! kill -0 "$srv_pid" 2>/dev/null; then
              echo "next start exited before becoming ready"
              exit 1
            fi
            sleep 2
          done
          BASE_URL=http://127.0.0.1:3456 node scripts/verify-sin-wp-smoke.mjs
          BASE_URL=http://127.0.0.1:3456 node scripts/verify-wp-media-html-guard.mjs
          kill "$srv_pid" 2>/dev/null || true

  unsigned-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@10.9.8
      - name: Install the locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail while unsigned copy markers remain in source
        run: npm run test:unsigned-copy
